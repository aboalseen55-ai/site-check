<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bassam</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-stage">
        <div class="hero-column">
          <div class="hero-copy">
            <h1>Explore the things <span>you love.</span></h1>
          </div>
          <div class="hero-visual" aria-label="Social media collage training visual">
            <img
              src="assets/User attachment.png"
              alt="Social media collage"
              onerror="this.onerror=null; this.src='assets/social-visual.svg';"
            />
          </div>
        </div>

        <aside class="login-column">
          <div class="login-brand-label">facebook</div>
          <form class="login-card" autocomplete="off" novalidate>
            <label>
              <input id="email" name="email" type="text" placeholder="Email or mobile number" />
            </label>
            <label>
              <input id="password" name="password" type="password" placeholder="Password" />
            </label>
            <button class="primary-button" type="submit">Log in</button>
            <p class="forgot-link"><a href="#">Forgot password?</a></p>
            <hr />
            <button class="secondary-button" type="button">Create new account</button>
            <p class="meta-brand">Meta</p>
          </form>
        </aside>
      </section>

      <footer class="footer-links">
        <a href="#">English (US)</a>
        <a href="#">العربية</a>
        <a href="#">Français (France)</a>
        <a href="#">Русский</a>
        <a href="#">Deutsch</a>
        <a href="#">Bahasa Indonesia</a>
        <a href="#">Español</a>
        <a href="#">More languages...</a>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
